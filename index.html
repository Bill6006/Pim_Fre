  let html = '<h2 id="sheet-title">Pimsleur French</h2>';
  if (!lib) html += menuItem('choose-folder', 'i-folder', 'Connect French folder', 'Levels I–V and bonus material');
  else if (connected) html += menuItem('choose-folder', 'i-folder', 'Choose folder again', `Audio connected · ${connected} of ${lib.lessons.length} lessons`);
  else html += menuItem('choose-folder', 'i-folder', 'Reconnect audio folder', 'Needed again after a browser restart');
  if (lib) html += menuItem('export', 'i-download', 'Export progress', 'Save a backup file');
  html += menuItem('import', 'i-upload', 'Import progress', 'Restore from a backup file');
  if (lib && state.prevLibrary) {
    html += menuItem('restore-prev', 'i-history', 'Restore previous library', `${state.prevLibrary.count} lessons · saved ${fmtDate(state.prevLibrary.savedAt)}`);
  }
  const where = state.idbOk ? (state.persisted ? 'Saved on this device · protected storage' : 'Saved on this device') : 'Saved on this device (backup copy)';
  html += `<div class="sheet-foot">${where} · v${APP_VERSION}</div>`;
  Sheet.show(html);
}

/* ==========================================================================
   Connecting / reconnecting the audio folder
   ========================================================================== */
function askReconnect(l) {
  state.pendingPlayId = l ? l.id : null;
  const partial = state.files.size > 0;
  Sheet.show(
    '<div class="sheet-icon" aria-hidden="true">🎧</div>'
    + `<h2 id="sheet-title">${partial ? 'Lesson audio not found' : 'Reconnect audio folder'}</h2>`
    + `<p>${partial
      ? 'This lesson wasn’t in the folder you chose. Choose your main French folder to include it.'
      : 'Android asks for folder access again after a restart. Choose the same French folder. Your progress is already saved.'}</p>`
    + '<button class="btn btn-primary" data-act="choose-folder"><svg class="i" aria-hidden="true"><use href="#i-folder"/></svg>Choose French folder</button>'
    + '<button class="btn btn-ghost" data-act="sheet-close">Not now</button>',
    { onClose: () => { state.pendingPlayId = null; } }
  );
}

function onFolderChosen() {
  const files = Array.from(els.folderInput.files || []);
  els.folderInput.value = ''; // lets the same folder be picked again later
  const playId = state.pendingPlayId;
  Sheet.hide();
  if (files.length) handleFolderFiles(files, playId);
}

function buildLibrary(scan) {
  const files = new Map();
  const lessons = scan.audio.map((e) => {
    const l = lessonFromEntry(e);
    files.set(l.id, e.file);
    return l;
  });
  return { lib: { schema: SCHEMA, rev: 0, scannedAt: Date.now(), rootName: scan.root, lessons: orderLessons(lessons) }, files };
}

async function handleFolderFiles(files, playId = null) {
  const scan = scanFiles(files);
  const where = scan.root ? `“${scan.root}”` : 'that folder';
  // An empty or wrong selection never touches the saved library.
  if (!scan.audio.length) { toast(`No audio files found in ${where}.`); return; }
  const lib = state.library;

  if (!lib) {
    const { lib: next, files: fileMap } = buildLibrary(scan);
    if (!persistLibrary(next)) return;
    state.library = next;
    state.files = fileMap;
    state.boot = 'ready';
    commitProgress(true);
    render();
    toast(`${next.lessons.length} lessons ready. Bonne écoute !`);
    requestPersistence();
    await Offline.reattach();
    Probe.run().then(() => Offline.fill());
    return;
  }

  const { matched, unmatched, offset } = reconcile(lib, scan.audio);
  if (!matched.size) {
    const ok = await ask({
      title: 'Replace your library?',
      body: `None of your ${lib.lessons.length} lessons are in ${where}. Use its ${scan.audio.length} audio files as your library instead? Your progress stays saved, and the current library is kept as a backup you can restore from the menu.`,
      confirm: 'Replace library',
      danger: true,
    });
    if (!ok) return;
    const { lib: next, files: fileMap } = buildLibrary(scan);
    if (!persistLibrary(next, { rotate: true, allowShrink: true })) return;
    if (state.current && !fileMap.has(state.current.id)) stopPlayback();
    state.library = next;
    state.files = fileMap;
    commitProgress(true);
    render();
    toast(`Library replaced · ${next.lessons.length} lessons`);
    Probe.run().then(() => Offline.fill());
    return;
  }

  // Same library (or part of it): reattach files, and add new audio without removing anything.
  let sizeChanged = false;
  for (const [id, m] of matched) {
    state.files.set(id, m.file);
    const l = derived.byId.get(id);
    if (l && l.size !== m.size) { l.size = m.size; l.duration = null; sizeChanged = true; }
  }
  let added = 0;
  if (unmatched.length) {
    const known = new Set(lib.lessons.map((l) => l.id));
    const extra = [];
    for (const e of unmatched) {
      const l = lessonFromEntry({ segs: librarySegs(e, offset, lib.rootName), size: e.size });
      if (known.has(l.id)) continue;
      known.add(l.id);
      extra.push(l);
      state.files.set(l.id, e.file);
    }
    if (extra.length) {
      const next = { ...lib, scannedAt: Date.now(), lessons: orderLessons(lib.lessons.map((l) => ({ ...l })).concat(extra)) };
      if (persistLibrary(next, { rotate: true })) { state.library = next; added = extra.length; sizeChanged = false; }
    }
  }
  if (sizeChanged) persistLibrary(state.library);
  commitProgress(true);
  render();

  const total = state.library.lessons.length;
  const connected = state.library.lessons.filter((l) => state.files.has(l.id)).length;
  let msg = connected >= total ? 'Audio connected' : `Connected ${connected} of ${total} lessons`;
  if (added) msg += ` · ${added} new lesson${added === 1 ? '' : 's'} added`;
  const wanted = playId && derived.byId.get(playId);
  if (wanted && !hasAudio(wanted.id)) msg = `Couldn’t find ${wanted.title} in ${where}`;
  toast(msg);
  if (wanted && hasAudio(wanted.id)) playLesson(wanted);
  Probe.run().then(() => Offline.fill());
}

async function restorePrevious() {
  let prev = null;
  try { prev = sanitizeLibrary((await IDB.getMany(['libraryPrev'])).libraryPrev); } catch (e) { prev = null; }
  if (!prev) { toast('No previous library snapshot was found.'); return; }
  const ok = await ask({
    title: 'Restore previous library?',
    body: `Switch back to the ${prev.lessons.length}-lesson library saved ${fmtDate(prev.savedAt)}. The current library becomes the backup, so you can switch again. Progress is not changed.`,
    confirm: 'Restore library',
  });
  if (!ok) return;
  if (!persistLibrary(prev, { rotate: true, allowShrink: true })) return;
  const ids = new Set(prev.lessons.map((l) => l.id));
  if (state.current && !ids.has(state.current.id)) stopPlayback();
  state.library = prev;
  commitProgress(true);
  render();
  toast('Previous library restored');
  Offline.reattach();
}

/* ==========================================================================
   Import / export (progress and lesson metadata only, never audio)
   ========================================================================== */
function exportProgress() {
  const P = state.progress;
  const lib = state.library;
  const data = {
    format: EXPORT_FORMAT,
    schemaVersion: SCHEMA,
    appVersion: APP_VERSION,
    exportedAt: new Date().toISOString(),
    progress: {
      completed: P.completed,
      positions: P.positions,
      collapsed: P.collapsed,
      speed: P.speed,
      lastLessonId: P.lastLessonId,
      celebrationCount: P.celebrationCount,
      fxSeed: P.fxSeed,
      playerMin: P.playerMin,
      keepOffline: P.keepOffline,
    },
    library: lib ? { rootName: lib.rootName, scannedAt: lib.scannedAt, lessons: lib.lessons } : null,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `pimsleur-french-progress-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Progress exported');
}

function parseBackup(data) {
  if (!isObj(data) || data.format !== EXPORT_FORMAT) return { error: 'That file isn’t a Pimsleur French progress backup.' };
  const v = data.schemaVersion;
  if (!Number.isInteger(v) || v < 1) return { error: 'That backup file is damaged.' };
  if (v > SCHEMA) return { error: 'That backup was made by a newer version of this app.' };
  const progress = sanitizeProgress({ ...(isObj(data.progress) ? data.progress : {}), schema: v });
  if (!progress) return { error: 'That backup file is damaged.' };
  const library = isObj(data.library) ? sanitizeLibrary({ ...data.library, schema: v }) : null;
  return { progress, library, exportedAt: Date.parse(data.exportedAt) || 0 };
}

async function onImportChosen() {
  const file = els.importInput.files && els.importInput.files[0];
  els.importInput.value = '';
  Sheet.hide();
  if (!file) return;
  if (file.size > 20 * 1024 * 1024) { toast('That file is too large to be a progress backup.'); return; }
  let data = null;
  try { data = JSON.parse(await file.text()); } catch (e) { data = null; }
  const parsed = parseBackup(data);
  if (parsed.error) { toast(parsed.error); return; }
  const libForCount = state.library || parsed.library;
  const ids = libForCount ? new Set(libForCount.lessons.map((l) => l.id)) : null;
  const count = Object.keys(parsed.progress.completed).filter((id) => !ids || ids.has(id)).length;
  const ok = await ask({
    title: 'Import progress?',
    body: `Backup from ${fmtDate(parsed.exportedAt)}: ${count} lesson${count === 1 ? '' : 's'} complete (you currently have ${derived.doneCount}). This replaces your current progress on this device.`,
    confirm: 'Import progress',
  });
  if (!ok) return;
  const incoming = parsed.progress;
  incoming.rev = int(state.progress.rev) + 1;
  state.progress = incoming;
  if (!state.library && parsed.library) {
    if (persistLibrary(parsed.library)) { state.library = parsed.library; state.boot = 'ready'; }
  } else if (state.library && parsed.library) {
    // Durations from the backup save re-measuring lessons that share an ID.
    const known = new Map(parsed.library.lessons.map((l) => [l.id, l.duration]));
    let filled = false;
    for (const l of state.library.lessons) if (!(l.duration > 0) && known.get(l.id) > 0) { l.duration = known.get(l.id); filled = true; }
    if (filled) persistLibrary(state.library);
  }
  if (state.current && state.current.id) state.current.skipSave = !!state.progress.completed[state.current.id];
  commitProgress(true);
  render();
  toast('Progress imported');
}

/* ==========================================================================
   Interaction (one delegated listener for every tap)
   ========================================================================== */
const ACTIONS = {
  'menu': openMenu,
  'choose-folder': () => els.folderInput.click(),
  'export': () => { Sheet.hide(); exportProgress(); },
  'import': () => els.importInput.click(),
  'restore-prev': () => { restorePrevious(); },
  'sheet-close': () => Sheet.hide(),
  'ask-yes': () => { settleAsk(true); Sheet.hide(); },
  'ask-no': () => { settleAsk(false); Sheet.hide(); },
  'toast-action': () => Toast.run(),
  'filter': (el) => { state.filter = el.dataset.filter; renderControls(); renderList(); },
  'clear-search': () => { els.q.value = ''; state.query = ''; renderControls(); renderList(); },
  'section': (el) => toggleSection(el.dataset.key),
  'play': (el) => playLesson(derived.lessons[+el.dataset.i]),
  'check': (el) => onCheck(+el.dataset.i, el),
  'hero': () => { const h = heroInfo(); if (h) playLesson(h.lesson); },
  'p-play': () => togglePlayback(),
  'p-prev': () => skipLesson(-1),
  'p-next': () => skipLesson(1),
  'p-back': () => seekBy(-10),
  'p-fwd': () => seekBy(10),
  'p-jump': jumpToCurrent,
  'p-min': () => { state.progress.playerMin = !state.progress.playerMin; commitProgress(); updatePlayerUI(); },
  'speed': toggleSpeeds,
  'set-speed': (el) => setSpeed(Number(el.dataset.speed)),
  'offline-manage': openOfflineSheet,
  'offline-finish': saveLessonsNow,
  'offline-enable': saveLessonsNow,
  'offline-remove': () => { removeSavedLessons(); },
};

function onClick(e) {
  if (!els.speeds.hidden && !e.target.closest('#p-speeds, #p-speed')) {
    els.speeds.hidden = true;
    $('p-speed').setAttribute('aria-expanded', 'false');
  }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn) fn(el, e);
}

function toggleSection(key) {
  if (state.query) return; // sections stay open while searching
  const sec = derived.sections.find((s) => s.key === key);
  if (!sec) return;
  state.progress.collapsed[key] = isSectionOpen(sec); // true = collapsed
  commitProgress(true);
  renderList();
}

function toggleSpeeds() {
  const open = els.speeds.hidden;
  if (open) {
    els.speeds.innerHTML = SPEEDS.map((v) => `<button data-act="set-speed" data-speed="${v}" aria-pressed="${v === state.progress.speed}">${fmtSpeed(v)}</button>`).join('');
  }
  els.speeds.hidden = !open;
  $('p-speed').setAttribute('aria-expanded', String(open));
}

function jumpToCurrent() {
  const c = state.current;
  const l = c && derived.byId.get(c.id);
  if (!l) return;
  const target = els.list.querySelector(`.row[data-i="${l.order}"]`) || els.list.querySelector(`.sec[data-key="${l.section}"]`);
  if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

const onSearch = (() => {
  let timer = 0;
  return () => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.query = els.q.value; renderControls(); renderList(); }, 120);
  };
})();

/* ==========================================================================
   Lifecycle: save on every exit path Android can take
   ========================================================================== */
function flushEverything() {
  saveCurrentPosition(true);
  flushLibrarySave();
  Store.flush();
}

function onVisible() {
  renderHeader();
  // Another tab (browser vs installed app) may have saved newer progress.
  const lsProg = sanitizeProgress(LS.read(LS_PROGRESS));
  if (lsProg && lsProg.rev > state.progress.rev) { state.progress = lsProg; derive(); render(); }
}

function onStorage(e) {
  if (e.key === LS_PROGRESS && e.newValue) {
    const incoming = sanitizeProgress(safeParse(e.newValue));
    if (incoming && incoming.rev > state.progress.rev) { state.progress = incoming; derive(); render(); }
  } else if (e.key === LS_LIBRARY && e.newValue) {
    const incoming = sanitizeLibrary(safeParse(e.newValue));
    if (incoming && (!state.library || incoming.rev > state.library.rev)) { state.library = incoming; state.boot = 'ready'; derive(); render(); }
  }
}

function bindEvents() {
  document.addEventListener('click', onClick);
  els.q.addEventListener('input', onSearch);
  els.q.addEventListener('keydown', (e) => { if (e.key === 'Enter') els.q.blur(); });
  els.folderInput.addEventListener('change', onFolderChosen);
  els.importInput.addEventListener('change', onImportChosen);
  els.seek.addEventListener('input', () => { scrubbing = true; updateTimeUI(); });
  els.seek.addEventListener('change', () => { scrubbing = false; seekTo(+els.seek.value); });
  els.seek.addEventListener('pointercancel', () => { scrubbing = false; updateTimeUI(); });
  audio.addEventListener('loadedmetadata', onLoadedMetadata);
  audio.addEventListener('timeupdate', onTimeUpdate);
  audio.addEventListener('play', onPlayState);
  audio.addEventListener('pause', () => { saveCurrentPosition(true); onPlayState(); });
  audio.addEventListener('seeked', () => { saveCurrentPosition(true); updatePositionState(); });
  audio.addEventListener('ratechange', updatePositionState);
  audio.addEventListener('ended', onEnded);
  audio.addEventListener('error', onAudioError);
  // visibilitychange is the exit signal Android reliably delivers (app switch, screen off,
  // before the OS reclaims a tab); pagehide covers refresh/navigation, freeze covers tab freezing.
  addEventListener('pagehide', flushEverything);
  document.addEventListener('freeze', flushEverything);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushEverything(); else onVisible();
  });
  addEventListener('pageshow', (e) => { if (e.persisted) onVisible(); });
  addEventListener('storage', onStorage);
  if ('ResizeObserver' in window) new ResizeObserver(setPlayerSpace).observe(els.player);
  bindMediaSession();
}

/* ==========================================================================
   PWA
   ========================================================================== */
function registerServiceWorker() {
  if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
  const go = () => navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' }).catch(() => { /* offline shell unavailable */ });
  if (document.readyState === 'complete') go(); else addEventListener('load', go, { once: true });
}

// Asks Chrome to exempt this origin from storage eviction. Chrome grants or
// denies this silently (installed apps usually qualify); there is no prompt.
async function requestPersistence() {
  try {
    if (!navigator.storage || !navigator.storage.persist) return;
    state.persisted = (await navigator.storage.persisted()) || (await navigator.storage.persist());
  } catch (e) { /* not available */ }
}

/* ==========================================================================
   Boot
   The cached library renders from the synchronous localStorage checkpoint
   on the first frame, before IndexedDB or any file access is involved.
   ========================================================================== */
function adoptStored(lsLib, lsProg, rec) {
  const idbLib = sanitizeLibrary(rec.library);
  const idbProg = sanitizeProgress(rec.progress);
  const prevLib = sanitizeLibrary(rec.libraryPrev);
  let lib = newest(lsLib, idbLib);
  let recovered = false;
  if (!lib && prevLib) { lib = prevLib; recovered = true; }
  if (lib && (!state.library || lib.rev > state.library.rev)) state.library = lib;
  const prog = newest(lsProg, idbProg);
  if (prog && prog.rev > state.progress.rev) state.progress = prog;
  state.prevLibrary = prevLib ? summarize(prevLib) : null;
  // Repair whichever store is behind.
  if (state.library) {
    if (!idbLib || idbLib.rev < state.library.rev) Store.queue('library', state.library, false);
    if (!lsLib || lsLib.rev < state.library.rev) LS.write(LS_LIBRARY, state.library);
  }
  if (!idbProg || idbProg.rev < state.progress.rev) Store.queue('progress', state.progress, false);
  if (!lsProg || lsProg.rev < state.progress.rev) LS.write(LS_PROGRESS, state.progress);
  state.boot = 'ready';
  derive();
  render();
  if (recovered) toast('Your library was restored from its backup snapshot.');
  if (state.library) requestPersistence();
}

function boot() {
  bindEvents();
  const lsLib = sanitizeLibrary(LS.read(LS_LIBRARY));
  const lsProg = sanitizeProgress(LS.read(LS_PROGRESS));
  if (lsProg) state.progress = lsProg;
  if (lsLib) { state.library = lsLib; state.boot = 'ready'; }
  derive();
  render();
  const loaded = IDB.getMany(['library', 'progress', 'libraryPrev']).then(
    (rec) => adoptStored(lsLib, lsProg, rec || {}),
    () => { state.idbOk = false; adoptStored(lsLib, lsProg, {}); }
  );
  // Saved lesson copies are looked up right after the library is known; a play tap
  // during this short window waits for it instead of asking for the folder.
  state.offlineReady = loaded
    .then(() => withTimeout(Offline.attach(), 5000))
    .then(() => { renderOffline(); Probe.run(); }, () => {});
  registerServiceWorker();
}

/* ==========================================================================
   Celebrations
   Each completion takes the next family from a per-install shuffled rotation:
   every family plays once before any repeats, in a new order each cycle,
   with parameters randomized per run. Effects draw into one short-lived
   full-screen canvas (plus a few DOM words) inside a layer that is removed
   when the effect ends. They never touch playback. prefers-reduced-motion
   gets a quiet fade instead.
   ========================================================================== */
const FX = (() => {
  const TAU = Math.PI * 2;
  const reduceMotion = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
  const EMOJI_FONT = '"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol",sans-serif';
  const TRI = ['#2f6bff', '#ffffff', '#ef4135'];
  // French typography puts a narrow no-break space before "!" ("OUI !").
  const NNBSP = String.fromCharCode(0x202f), NBSP = String.fromCharCode(0xa0);
  const bang = (word) => word + NNBSP + '!';
  const PAL = {
    tricolor: ['#2f6bff', '#ffffff', '#ef4135', '#ffd76a'],
    gold: ['#ffd76a', '#ffb830', '#fff3c4', '#f59e0b'],
    neon: ['#39f3ff', '#ff3df2', '#7cff6b', '#ffe53d'],
    pastel: ['#a5c8ff', '#ffc2d1', '#fff1a8', '#c8f7dc', '#d9c2ff'],
    ice: ['#9ad8ff', '#e0f2ff', '#5b8def', '#ffffff'],
    candy: ['#ff5d8f', '#ffd166', '#06d6a0', '#118ab2', '#ef476f'],
  };
  const cache = new Map(); // sprite canvases, cleared after every celebration
  let DPR = 1;
  let active = null;
  let deferred = null;

  const rnd = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
  const irnd = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const sgn = () => (Math.random() < 0.5 ? -1 : 1);
  const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);
  const ease = {
    outCubic: (t) => 1 - (1 - t) ** 3,
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: (t, s = 1.70158) => 1 + (s + 1) * (t - 1) ** 3 + s * (t - 1) ** 2,
    outElastic: (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 2 ** (-10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
  };
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };

  // Transform in CSS pixels on top of the device-pixel-ratio scale.
  function xf(ctx, x, y, r = 0, sx = 1, sy = sx) {
    const c = Math.cos(r), s = Math.sin(r);
    ctx.setTransform(DPR * c * sx, DPR * s * sx, -DPR * s * sy, DPR * c * sy, DPR * x, DPR * y);
  }

  /* ----- sprites (pre-rendered once per celebration) ----- */
  function sprite(key, size, paint) {
    let c = cache.get(key);
    if (!c) {
      c = document.createElement('canvas');
      c.width = c.height = size;
      paint(c.getContext('2d'), size);
      cache.set(key, c);
    }
    return c;
  }
  const emoji = (ch, px = 72) => sprite(`e${ch}${px}`, Math.ceil(px * 1.3), (g, s) => {
    g.font = `${px}px ${EMOJI_FONT}`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillText(ch, s / 2, s / 2 + px * 0.05);
  });
  const glyph = (ch, px, color) => sprite(`t${ch}${px}${color}`, Math.ceil(px * 1.4), (g, s) => {
    g.font = `700 ${px}px system-ui, sans-serif`;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = color;
    g.fillText(ch, s / 2, s / 2);
  });
  const glow = (hex, px = 64) => sprite(`g${hex}${px}`, px, (g, s) => {
    const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    grd.addColorStop(0, rgba(hex, 1));
    grd.addColorStop(0.28, rgba(hex, 0.55));
    grd.addColorStop(1, rgba(hex, 0));
    g.fillStyle = grd;
    g.fillRect(0, 0, s, s);
  });
  const bubble = (hue) => sprite(`b${hue}`, 64, (g) => {
    const grd = g.createRadialGradient(32, 32, 16, 32, 32, 31);
    grd.addColorStop(0, `hsla(${hue},90%,80%,0.03)`);
    grd.addColorStop(0.78, `hsla(${hue},90%,78%,0.22)`);
    grd.addColorStop(1, `hsla(${(hue + 70) % 360},95%,84%,0.9)`);
    g.fillStyle = grd;
    g.beginPath(); g.arc(32, 32, 31, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.8)';
    g.beginPath(); g.ellipse(21, 20, 7, 4, -0.7, 0, TAU); g.fill();
  });

  /* ----- particles ----- */
  class Particle {
    constructor(S, o) {
      this.x = S.ox; this.y = S.oy; this.vx = 0; this.vy = 0; this.ax = 0; this.ay = 0; this.g = 0; this.drag = 0;
      this.rot = 0; this.vr = 0; this.age = 0; this.life = 1.5; this.delay = 0; this.size = 4; this.scale = 1;
      this.alpha = 1; this.fadeIn = 0; this.fadeOut = 0.35; this.blend = null; this.color = '#ffffff';
      this.paint = paintDot; this.tick = null;
      Object.assign(this, o);
    }
    update(dt, S) {
      if (this.delay > 0) { this.delay -= dt; return true; }
      this.age += dt;
      if (this.age >= this.life) return false;
      if (this.drag) { const k = Math.exp(-this.drag * dt); this.vx *= k; this.vy *= k; }
      this.vx += this.ax * dt;
      this.vy += (this.ay + this.g) * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.rot += this.vr * dt;
      return !(this.tick && this.tick(this, dt, S) === false);
    }
    draw(ctx, S) {
      if (this.delay > 0) return;
      let a = this.alpha;
      if (this.fadeIn) a *= clamp01(this.age / this.fadeIn);
      if (this.fadeOut) a *= clamp01((this.life - this.age) / this.fadeOut);
      if (a <= 0.004) return;
      ctx.globalAlpha = a;
      if (this.blend) ctx.globalCompositeOperation = this.blend;
      this.paint(ctx, this, S);
    }
  }
  function paintDot(ctx, p) { xf(ctx, p.x, p.y); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, p.size * p.scale), 0, TAU); ctx.fill(); }
  function paintRing(ctx, p) { xf(ctx, p.x, p.y); ctx.strokeStyle = p.color; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.arc(0, 0, Math.max(0.1, p.size), 0, TAU); ctx.stroke(); }
  function paintSprite(ctx, p) {
    const s = p.size * p.scale;
    if (s <= 0.2) return;
    xf(ctx, p.x, p.y, p.rot, p.flip ? -1 : 1, 1);

  }
  function paintGlow(ctx, p) { const s = p.size * p.scale; xf(ctx, p.x, p.y); ctx.drawImage(p.img, -s / 2, -s / 2, s, s); }
  function paintConfetti(ctx, p) {
    xf(ctx, p.x, p.y, p.rot, Math.cos(p.age * p.flipRate + p.phase), 1); // flutter: the paper turns edge-on
    ctx.fillStyle = p.color;

  function paintStreak(ctx, p) {
    xf(ctx, 0, 0);

  function paintStar(ctx, p) {
    if (p.scale <= 0.01) return;

    ctx.closePath();

  function paintShard(ctx, p) {
    xf(ctx, p.x, p.y, p.rot, Math.cos(p.age * p.flipRate + p.phase), 1);
    const q = p.pts;
    ctx.beginPath(); ctx.moveTo(q[0], q[1]); ctx.lineTo(q[2], q[3]); ctx.lineTo(q[4], q[5]); ctx.closePath();

  }

  /* ----- reusable actors ----- */
  // A timed actor: draw(ctx, k, age, S) with k = age / life; an optional delay comes first.
  function timed(life, draw, delay = 0) {
    return {
      age: -delay,
      update(dt) { this.age += dt; return this.age < life; },
      draw(ctx, S) { if (this.age >= 0) draw(ctx, this.age / life, this.age, S); },

  const ring = (x, y, r0, r1, life, color, width, delay = 0) => timed(life, (ctx, k) => {
    ctx.globalAlpha = (1 - k) * 0.9;

    ctx.strokeStyle = color;
    ctx.lineWidth = width * (1 - k) + 0.5;

  const wash = (color, maxA, life, shape = 'fade') => timed(life, (ctx, k, age, S) => {
    ctx.globalAlpha = shape === 'arc' ? maxA * Math.sin(Math.PI * k) : maxA * (1 - k);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, S.W * DPR, S.H * DPR);
  });
  const grow = (rate) => (p, dt) => { p.size += rate * dt; };
  const twinkle = (p) => { p.scale = Math.sin((Math.PI * p.age) / p.life) * 1.25; };
  function burst(S, x, y, pal, n, opts = {}) {

    }
    S.p({ x, y, img: glow(pal[0]), paint: paintGlow, size: 30, life: 0.45, blend: 'lighter', fadeOut: 0.45, tick: (p) => { p.size = 30 + p.age * 500; } });
  }
  function letterSpans(word, text) {
    return [...text].map((ch) => {
      const s = document.createElement('span');
      s.textContent = ch === NNBSP ? NBSP : ch; // a lone inline-block space would collapse
      word.appendChild(s);
      return s;
    });
  }

  /* ----- the families ----- */
  const FAMILIES = [
    { name: 'Confetti cannon', run(S) {

    { name: 'Flag assembly', run(S) {

      const x0 = (S.W - fw) / 2, y0 = clamp(S.H * 0.3 - fh / 2, 40, S.H - fh - 40);

      }

      S.add({
        update(dt) {

            e.th += e.w * dt;
            const c = Math.cos(e.th) * e.a * open, s = Math.sin(e.th) * e.b * open;

        const x = i === 0 ? S.ox : clamp(S.ox + rnd(-S.W * 0.5, S.W * 0.5), 30, S.W - 30);
        const y = i === 0 ? S.oy : clamp(S.oy + rnd(-S.H * 0.35, S.H * 0.35), 60, S.H - 60);
        const R = rnd(18, 46), color = pick(pal), bumps = irnd(9, 14), life = rnd(1.9, 2.5);
        const pts = Array.from({ length: bumps }, (_, j) => { const a = (j / bumps) * TAU, r = R * rnd(0.72, 1.3); return [Math.cos(a) * r, Math.sin(a) * r]; });
        const drops = Array.from({ length: irnd(4, 9) }, () => ({ a: rnd(TAU), d: rnd(1.3, 2.3), r: rnd(0.08, 0.2) }));
        const drips = Array.from({ length: irnd(0, 2) }, () => ({ x: rnd(-0.5, 0.5) * R, v: rnd(30, 80), w: rnd(3, 7) }));
        S.add(timed(life, (ctx, k, age) => {
          const s = age < 0.16 ? ease.outBack(age / 0.16, 2) : 1;
          ctx.globalAlpha = clamp01((life - age) / 0.5) * 0.92;
          xf(ctx, x, y, 0, s);
          ctx.fillStyle = color;
          ctx.beginPath();
          const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
          const m0 = mid(pts[bumps - 1], pts[0]);
          ctx.moveTo(m0[0], m0[1]);
          for (let j = 0; j < bumps; j++) { const p = pts[j], m = mid(p, pts[(j + 1) % bumps]); ctx.quadraticCurveTo(p[0], p[1], m[0], m[1]); }
          ctx.closePath();
          ctx.fill();
          for (const d of drops) { ctx.beginPath(); ctx.arc(Math.cos(d.a) * R * d.d, Math.sin(d.a) * R * d.d, R * d.r, 0, TAU); ctx.fill(); }
          for (const d of drips) {
            const len = R * 0.7 + Math.max(0, age - 0.2) * d.v;
            ctx.fillRect(d.x - d.w / 2, 0, d.w, len);
            ctx.beginPath(); ctx.arc(d.x, len, d.w * 0.75, 0, TAU); ctx.fill();
          }
        }, i * rnd(0.06, 0.12)));
      }
    } },

    { name: 'Fireworks', run(S) {
      const rockets = irnd(3, 5);
      const pals = [['#2f6bff', '#9ec0ff'], ['#ffffff', '#dbe4ff'], ['#ef4135', '#ff9aa2'], PAL.gold];
      for (let i = 0; i < rockets; i++) {
        const x = S.W * (0.15 + (0.7 * (i + 0.5)) / rockets) + rnd(-20, 20), apex = rnd(S.H * 0.14, S.H * 0.38), pal = pals[i % pals.length];
        S.p({ x, y: S.H + 10, vx: rnd(-40, 40), vy: -Math.sqrt(2 * 900 * (S.H + 10 - apex)), g: 900, size: 2.5, color: '#fff3c4', blend: 'lighter', delay: i * rnd(0.18, 0.3), life: 3, fadeOut: 0,
          tick: (p) => {
            if (Math.random() < 0.8) S.p({ x: p.x, y: p.y, vx: rnd(-20, 20), vy: rnd(20, 60), size: rnd(1, 2), color: '#ffd76a', blend: 'lighter', life: 0.35, fadeOut: 0.35 });
            if (p.vy < -30) return true;
            burst(S, p.x, p.y, pal, irnd(50, 80), { crackle: true });
            return false;
          } });
      }
    } },
  ];

  /* ----- engine ----- */
  function play(index, x, y) {
    stop();
    const fam = FAMILIES[((index % FAMILIES.length) + FAMILIES.length) % FAMILIES.length];
    const W = innerWidth, H = innerHeight;
    DPR = Math.min(2, window.devicePixelRatio || 1);
    const layer = document.createElement('div');
    layer.className = 'fx-layer';
    layer.setAttribute('aria-hidden', 'true');
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    layer.appendChild(canvas);
    document.body.appendChild(layer);
    const ctx = canvas.getContext('2d');
    const S = {
      W, H, ctx, layer,
      ox: clamp(x, 0, W),
      oy: clamp(y, 0, H),
      t: 0,
      maxT: 5,
      actors: [],
      timers: [],
      anims: new Set(),
      add(a) { this.actors.push(a); return a; },
      p(o) { return this.add(new Particle(this, o)); },
      at(sec, fn) { this.timers.push({ at: sec, fn }); },
      el(cls, text) {
        const e = document.createElement('div');
        e.className = cls;
        if (text) e.textContent = text;
        layer.appendChild(e);
        return e;
      },
      anim(el, frames, opts) {
        const a = el.animate(frames, opts);
        this.anims.add(a);
        const done = () => this.anims.delete(a);
        a.finished.then(done, done);
        return a;
      },
      // Moves the page itself. The player and sheets sit outside #app and stay put.
      appAnim(frames, opts, origin) {
        const app = $('app');
        if (origin) app.style.transformOrigin = origin;
        const a = this.anim(app, frames, opts);
        const reset = () => { app.style.transformOrigin = ''; };
        a.finished.then(reset, reset);
        return a;
      },
    };
    active = { S, raf: 0, safety: setTimeout(stop, 8000) };
    try { fam.run(S); } catch (e) { console.error(`Celebration "${fam.name}" failed`, e); stop(); return; }
    let last = performance.now();
    const frame = (now) => {
      if (!active || active.S !== S) return;
      try {
        const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
        last = now;
        S.t += dt;
        for (let i = S.timers.length - 1; i >= 0; i--) {
          if (S.t >= S.timers[i].at) S.timers.splice(i, 1)[0].fn();
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const A = S.actors;
        let w = 0;
        for (let i = 0; i < A.length; i++) if (A[i].update(dt, S)) A[w++] = A[i];
        A.length = w;
        for (let i = 0; i < A.length; i++) {
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = 'source-over';
          A[i].draw(ctx, S);
        }
        if ((!A.length && !S.timers.length && !S.anims.size && S.t > 0.25) || S.t > S.maxT) { stop(); return; }
      } catch (e) { console.error(`Celebration "${fam.name}" failed`, e); stop(); return; }
      active.raf = requestAnimationFrame(frame);
    };
    active.raf = requestAnimationFrame(frame);
  }

  function stop() {
    if (!active) return;
    const { S } = active;
    cancelAnimationFrame(active.raf);
    clearTimeout(active.safety);
    for (const a of S.anims) { try { a.cancel(); } catch (e) { /* ignore */ } }
    S.anims.clear();
    S.actors.length = 0;
    S.timers.length = 0;
    S.layer.remove();
    active = null;
    cache.clear();
  }

  function gentle(x, y) {
    const layer = document.createElement('div');
    layer.className = 'fx-layer';
    layer.setAttribute('aria-hidden', 'true');
    const badge = document.createElement('div');
    badge.className = 'fx-gentle';
    badge.textContent = '✓ Bravo';
    badge.style.left = `${clamp(x, 60, innerWidth - 60)}px`;
    badge.style.top = `${clamp(y, 80, innerHeight - 20)}px`;
    layer.appendChild(badge);
    document.body.appendChild(layer);
    const a = badge.animate([{ opacity: 0 }, { opacity: 1, offset: 0.2 }, { opacity: 1, offset: 0.75 }, { opacity: 0 }], { duration: 1400, easing: 'ease' });
    const done = () => layer.remove();
    a.finished.then(done, done);
  }

  /* ----- rotation ----- */
  function mulberry32(a) {
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function cycleOrder(cycle, seed) {
    const order = FAMILIES.map((_, i) => i);
    const rand = mulberry32((seed ^ Math.imul(cycle + 1, 0x9e3779b1)) >>> 0);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    return order;
  }
  // Every family plays once per cycle; a new cycle never opens with the family that just played.
  function familyIndex(count, seed) {
    const n = FAMILIES.length, cycle = Math.floor(count / n);
    const order = cycleOrder(cycle, seed);
    if (cycle > 0 && order[0] === cycleOrder(cycle - 1, seed)[n - 1]) [order[0], order[1]] = [order[1], order[0]];
    return order[count % n];
  }

  // A lesson that finishes with the screen off celebrates when the app is next visible.
  function celebrate(getPoint, count, seed) {
    if (document.hidden) { deferred = { getPoint, count, seed }; return; }
    const pt = getPoint();
    if (reduceMotion.matches) { gentle(pt.x, pt.y); return; }
    play(familyIndex(count, seed), pt.x, pt.y);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !deferred) return;
    const d = deferred;
    deferred = null;
    setTimeout(() => celebrate(d.getPoint, d.count, d.seed), 350);
  });

  return { celebrate, play, stop, familyIndex, names: () => FAMILIES.map((f) => f.name), isActive: () => !!active };
})();

if (DEBUG) {
  // ?debug exposes internals for testing in DevTools. It is inert otherwise.
  window.pimfr = {
    state,
    get derived() { return derived; },
    FX,
    Offline,
    ingest: (files, playId) => handleFolderFiles(Array.from(files), playId || null),
  };
}

boot();
})();
</script>
